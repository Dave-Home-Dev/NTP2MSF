[platformio]
default_envs = d1_mini

; Firmware for the LoLin/Wemos D1 Mini
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Isrc

; Host-side unit tests for the hardware-independent logic:  pio test -e native
[env:native]
platform = native
test_build_src = yes
build_flags = -std=gnu++17 -Wall -Wextra -Isrc
build_src_filter = -<*> +<MsfFrame.cpp> +<UkTime.cpp>
